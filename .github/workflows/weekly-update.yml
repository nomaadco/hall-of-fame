name: Weekly Sleeper update

on:
  schedule:
    # Tuesdays at 12:00 PM Eastern. GitHub schedules are in UTC, and Eastern shifts by an hour
    # with daylight saving, so it fires at both 16:00 and 17:00 UTC and the first step keeps
    # only the one that is noon in New York. (GitHub can start scheduled runs a bit late.)
    - cron: '0 16 * * 2'
    - cron: '0 17 * * 2'
  workflow_dispatch:        # "Run workflow" button on the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  # Fires at 16:00 and 17:00 UTC; only the one that is noon in New York goes ahead.
  when:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          go=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            want=$([ "${{ github.event.schedule }}" = "0 16 * * 2" ] && echo EDT || echo EST)
            if [ "$(TZ=America/New_York date +%Z)" != "$want" ]; then
              echo "Not noon in New York for this trigger. Skipping."
              go=false
            fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  update:
    needs: when
    if: needs.when.outputs.go == 'true'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - name: Pull current season from Sleeper
        working-directory: build
        run: python pull_sleeper.py
      - name: Rebuild the page
        working-directory: build
        run: python build_hof.py --merge sleeper_current.json
      - name: Commit if anything changed
        id: commit
        run: |
          git add index.html build/sleeper.json build/hof_data.json
          if git diff --cached --quiet; then
            echo "No new results this week."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "Weekly Sleeper update"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # A commit made by this workflow doesn't trigger other workflows, so publish from here.
  publish:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
