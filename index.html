<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CFFFL Hall of Fame</title>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@600;700;800;900&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: left sidebar shell (league nav groups), page heads with icon tiles, card grids. Carvers maroon + gold. */
:root{
  --bg:#f6f4ec; --panel:#ffffff; --raised:#faf8f2; --ink:#1d1517; --muted:#6f6866; --line:#e7e2d6;
  --turf:#4f0f1d; --turf-2:#5c1424; --num:#4f0f1d; --turf-ink:#fffaf0;      /* Carvers maroon (in place of Fantasy HofF green) */
  --brass:#b7892b; --brass-hi:#e9c46a; --glow:rgba(183,137,43,.14);
  --crimson:#a03123;
  --win:#2f7d4f; --loss:#a03123; --tie:#8a7128;
  --font-display:"Libre Franklin","Figtree",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-stat:"Figtree",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(29,21,23,.05),0 6px 18px -12px rgba(29,21,23,.18);
}
*{box-sizing:border-box}
:root{color-scheme:light}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.crest{display:flex;align-items:center;gap:10px}
.crest .mark{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(160deg,var(--brass-hi),var(--brass));color:#1a1206;font:800 16px var(--font-display);letter-spacing:.02em}
h1{font-family:var(--font-display);font-weight:800;font-size:clamp(24px,6vw,32px);letter-spacing:.03em;margin:0;line-height:1;text-transform:uppercase}
.since{font-family:var(--font-stat);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.7}
nav a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
main>*{min-width:0}
#app div,#app section{min-width:0}
h2{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
h2 small{font:600 12px var(--font-stat);letter-spacing:.14em;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.pick{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.pick label{display:block;font-family:var(--font-stat);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
select{width:100%;font:600 16px var(--font-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.vs{font-family:var(--font-display);font-weight:800;color:var(--brass);font-size:22px;padding-top:18px}
.board{padding:22px 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;
  background:radial-gradient(120% 140% at 50% 0%,var(--glow),transparent 60%)}
.board .nm{font-weight:700;font-size:15px;min-width:0;overflow-wrap:anywhere}
.board .big{font-family:var(--font-display);font-weight:800;font-size:clamp(56px,16vw,88px);line-height:.9;font-variant-numeric:tabular-nums}
.board .dash{font-family:var(--font-display);font-size:36px;color:var(--muted)}
.lead{color:var(--brass)}
.sub{grid-column:1/-1;font-size:14px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.facts div{background:var(--panel);padding:12px 14px}
.facts b{display:block;font-family:var(--font-stat);font-size:21px;font-variant-numeric:tabular-nums}
.facts span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-family:var(--font-stat)}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.log li:first-child{border-top:0}
.log li.riv{cursor:pointer}.log li.riv:hover{background:var(--raised)}.log li.riv:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
.when{font-family:var(--font-stat);font-size:13px;color:var(--muted);line-height:1.2}
.teams{min-width:0;font-size:14px}
.teams .t{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.score{font-family:var(--font-stat);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-family:var(--font-stat);font-weight:700;font-size:12px;letter-spacing:.06em;padding:1px 7px;border-radius:4px;margin-left:6px;vertical-align:1px}
.pill.W{background:color-mix(in srgb,var(--win) 16%,transparent);color:var(--win)}
.pill.L{background:color-mix(in srgb,var(--loss) 16%,transparent);color:var(--loss)}
.pill.T{background:color-mix(in srgb,var(--tie) 18%,transparent);color:var(--tie)}
.tag{font-family:var(--font-stat);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font:600 15px var(--font-stat);letter-spacing:.06em;padding:7px 15px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.chips button:hover{border-color:var(--brass)}
.chips button[aria-pressed="true"]{background:var(--turf);color:var(--brass-hi);border-color:var(--turf)}
.banner{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;padding:18px;background:var(--turf);color:var(--turf-ink);border-color:transparent}
.trophy{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,var(--brass-hi),var(--brass));color:#1a1206;font-family:var(--font-display);font-weight:800;font-size:22px;box-shadow:0 0 0 4px color-mix(in srgb,var(--brass) 25%,transparent)}
.banner .yr{font-family:var(--font-stat);font-size:13px;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.banner .champ{font-family:var(--font-display);font-weight:800;font-size:clamp(24px,6vw,34px);line-height:1;text-transform:uppercase;letter-spacing:.02em;color:var(--brass-hi)}
.banner .team{opacity:.8;font-size:14px;margin-top:2px}
.banner .tbd{color:var(--turf-ink)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:520px}
th{font-family:var(--font-stat);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--raised)}
td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--raised)}
td.n,th.n{text-align:right}
td.rk{font-family:var(--font-display);font-weight:800;font-size:18px;width:40px;color:var(--muted)}
tr.top td.rk{color:var(--brass)}
.who{font-weight:600}.who small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.tbd{color:var(--muted);font-style:italic;font-weight:400}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(270px,100%),1fr));gap:16px}.grid2>*,.banner>*{min-width:0}.banner .champ{overflow-wrap:anywhere}
.rec h3{font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:.06em;text-transform:uppercase;margin:0;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--raised)}
.rec ol{margin:0;padding:0;list-style:none}
.rec h3 small{font:500 12px var(--font-body);color:var(--muted);letter-spacing:0;text-transform:none;margin-left:4px}
.rec li{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 16px;border-top:1px solid var(--line);font-size:14px}
.rec li:first-child{border-top:0}
.rec li:first-child .v{color:var(--brass)}
.rec li .v{font-family:var(--font-display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.rec li small{display:block;color:var(--muted);font-size:12.5px}
.note{font-size:13px;color:var(--muted);max-width:65ch}
.ostats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line)}
.ostats div{background:var(--panel);padding:14px 16px}
.ostats b{display:block;font-family:var(--font-display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;line-height:1.05}
.ostats span{font-family:var(--font-stat);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ohead{padding:18px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--turf);color:var(--turf-ink)}
.ohead .nm{font-family:var(--font-display);font-weight:800;font-size:clamp(24px,6vw,32px);text-transform:uppercase}
.ohead .rings{color:var(--brass-hi)}
.rings{color:var(--brass);font-family:var(--font-stat);font-weight:700;letter-spacing:.08em}
.wl{font-family:var(--font-stat);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.wl.pos{color:var(--win)}.wl.neg{color:var(--loss)}
/* ---- Home: jumbotron, rafters, tiles ---- */
.jumbo{position:relative;border-radius:14px;overflow:hidden;color:var(--turf-ink);padding:26px 22px 22px;
  background:radial-gradient(90% 120% at 85% -10%,color-mix(in srgb,var(--brass-hi) 30%,transparent),transparent 55%),
             radial-gradient(70% 90% at 0% 110%,rgba(80,120,220,.25),transparent 60%),linear-gradient(160deg,var(--turf-2),var(--turf));
  box-shadow:var(--shadow)}
.jumbo::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.025) 3px 4px);pointer-events:none}
.jumbo .eyebrow{font:700 12.5px var(--font-stat);letter-spacing:.2em;text-transform:uppercase;color:var(--brass-hi)}
.jumbo .headline{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:clamp(34px,9vw,60px);line-height:.92;margin:8px 0 6px;letter-spacing:.01em;text-wrap:balance}
.jumbo .headline em{font-style:normal;color:var(--brass-hi)}
.jumbo .dek{opacity:.8;max-width:56ch;font-size:15px}
.jstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px;position:relative;z-index:1}
.jstats div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 12px}
.jstats b{display:block;font:800 30px/1 var(--font-display);color:var(--turf-ink);font-variant-numeric:tabular-nums}
.jstats span{font:600 11.5px var(--font-stat);letter-spacing:.12em;text-transform:uppercase;opacity:.7}
@media (max-width:560px){.jstats{grid-template-columns:repeat(2,1fr)}}
.rafters{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px 10px;padding:4px 2px 10px}.rafters .pennant{flex:none}
.pennant{flex:0 0 96px;min-height:132px;position:relative;color:var(--turf-ink);text-align:center;padding:12px 7px 30px;display:flex;flex-direction:column;align-items:center;
  background:var(--turf);clip-path:polygon(0 0,100% 0,100% 82%,50% 100%,0 82%);
  border-top:4px solid var(--brass-hi);cursor:pointer;transition:transform .15s}
.pennant:hover,.pennant:focus-visible{transform:translateY(-3px)}
.pennant .y{font:800 26px/1 var(--font-display);color:#fff}
.pennant .c{font:800 12px/1.15 var(--font-display);letter-spacing:.02em;text-transform:uppercase;margin-top:9px;color:var(--brass-hi);overflow-wrap:anywhere;hyphens:auto;max-width:100%}
.pennant .p{font:600 10.5px/1.2 var(--font-body);color:#fff;margin-top:5px;letter-spacing:.02em;opacity:.9}
.pennant.live{border-top-color:var(--crimson)}.pennant.live .y{color:var(--turf-ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.tiles>*{min-width:0}
.tile{padding:16px;display:grid;gap:4px;position:relative}
.tile .k{font:700 12px var(--font-stat);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tile .v{font:800 40px/1 var(--font-display);color:var(--brass);font-variant-numeric:tabular-nums}
.tile .w{font-weight:700}
.tile .s{font-size:13px;color:var(--muted)}
.pr td .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:70px}
.pr td .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brass),var(--brass-hi))}
.mv{font:700 12px var(--font-stat)}.mv.up{color:var(--win)}.mv.dn{color:var(--loss)}
.wkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.mu{padding:12px 14px;display:grid;gap:6px}
.mu .row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline}
.mu .row.w .nmx{font-weight:700}.mu .row.w .sc{color:var(--ink)}.mu .row.l .sc{color:var(--muted)}
.mu .sc{font:800 20px var(--font-display);font-variant-numeric:tabular-nums}
.mu .nmx small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.split{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}.split>*{min-width:0}
@media (max-width:820px){.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.jstats{grid-template-columns:repeat(2,minmax(0,1fr))}.jstats b{font-size:24px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile .v{font-size:30px}.pr th:nth-child(4),.pr td:nth-child(4),.pr th:nth-child(6),.pr td:nth-child(6){display:none}}
@media (max-width:760px){.split{grid-template-columns:1fr}}
@media (max-width:420px){.log li{grid-template-columns:52px 1fr auto;gap:8px;padding:10px 12px}.board{padding:16px 10px}}
@media (prefers-reduced-motion:no-preference){.panel,.jumbo{animation:rise .3s ease-out both}@keyframes rise{from{transform:translateY(6px)}to{transform:none}}}
.kp{display:inline-block;font:700 10.5px var(--font-stat);letter-spacing:.08em;text-transform:uppercase;background:var(--brass);color:#1a1405;border-radius:4px;padding:1px 5px;vertical-align:1px}
.tx-h{font:600 12px var(--font-stat);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 14px 4px}
.mu .gets{font-size:14px;text-align:right;max-width:60%}
input[type=search]{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.trade .side{padding:8px 14px;border-top:1px solid var(--line)}.trade .side:first-of-type{border-top:0}
.trade .side b{display:block;font-size:14px}.trade .side span{font-size:13.5px;color:var(--muted)}
/* ---- App shell: left sidebar + content ---- */
body{margin:0}
.scrim{display:none}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
aside.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--turf);color:var(--turf-ink);
  display:flex;flex-direction:column;padding:14px 12px 16px;scrollbar-width:thin;z-index:20}
.side .brandrow{display:flex;align-items:center;gap:10px;padding:4px 6px 12px}
.side .mark{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(160deg,var(--brass-hi),var(--brass));color:#2a0a10;font:800 16px var(--font-display)}
.side .bt{font:800 15px/1.05 var(--font-display);letter-spacing:.06em;text-transform:uppercase}
.side .bt small{display:block;font:600 11px var(--font-stat);letter-spacing:.14em;opacity:.65;margin-top:2px}
.lgchip{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);border-radius:9px;padding:8px 10px;font:600 13px var(--font-body);margin:0 2px 8px}
.lgchip span{opacity:.6;font:600 12px var(--font-stat);letter-spacing:.06em}
.navgrp{font:700 11px var(--font-stat);letter-spacing:.18em;text-transform:uppercase;color:var(--brass-hi);padding:14px 8px 6px}
nav.sn{display:grid;gap:2px}
nav.sn a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--turf-ink);text-decoration:none;font:500 14.5px var(--font-body);opacity:.82}
nav.sn a svg,nav.sn a i{width:17px;height:17px;flex:0 0 17px;opacity:.85}
nav.sn a:hover{background:rgba(255,255,255,.07);opacity:1}
nav.sn a[aria-current="page"]{background:var(--bg);color:var(--ink);opacity:1;font-weight:600;box-shadow:0 1px 0 rgba(0,0,0,.15)}
nav.sn a[aria-current="page"] svg{color:var(--turf-2)}
.side .sfoot{margin-top:auto;padding-top:14px}
.sfcard{border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:10px 12px;background:rgba(0,0,0,.12);font-size:12.5px}
.sfcard b{display:flex;justify-content:space-between;font:700 11.5px var(--font-stat);letter-spacing:.14em;text-transform:uppercase;color:var(--brass-hi)}
.sfcard .meter{height:5px;border-radius:3px;background:rgba(255,255,255,.12);margin:8px 0 6px;overflow:hidden}.sfcard .meter i{display:block;height:100%;background:var(--brass-hi)}
.sfcard p{margin:0;opacity:.75}
.content{min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
main{max-width:1180px;width:100%;margin:0 auto;padding:22px 28px 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-content:start}
main>*{min-width:0}
footer{max-width:1180px;width:100%;margin:0 auto;padding:0 28px 32px}
/* page head */
.phead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.phead .l{display:flex;align-items:center;gap:14px;min-width:0}
.picon{width:46px;height:46px;border-radius:11px;display:grid;place-items:center;background:var(--turf);color:var(--brass-hi);flex:0 0 46px}
.picon svg{width:22px;height:22px}
.tly li .ic svg,.wire .ic svg{display:block}
.bigtile svg,.crestbox svg{width:22px;height:22px;color:var(--brass-hi)}
.btn svg{width:16px;height:16px}
.rrow svg{width:18px;height:18px;color:var(--brass)}
.cats .ci svg{width:19px;height:19px}
.eyebrow2{font:700 12px var(--font-stat);letter-spacing:.2em;text-transform:uppercase;color:var(--brass)}
.ptitle{font:800 clamp(30px,5vw,44px)/.95 var(--font-display);text-transform:uppercase;letter-spacing:.01em;margin:2px 0 0}
.statbox{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
.statbox>div{padding:8px 14px;border-left:1px solid var(--line)}.statbox>div:first-child{border-left:0}
.statbox .dk{background:var(--turf);color:var(--turf-ink)}
.statbox b{display:block;font:800 20px/1.05 var(--font-display)}
.statbox span{font:600 11px var(--font-stat);letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.statbox .dk span{color:var(--brass-hi);opacity:1}
/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.card .ch{padding:16px 18px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card .ch .eyebrow2{font-size:11px}
.card .ch h3{font:800 22px/1 var(--font-display);text-transform:uppercase;margin:4px 0 0;letter-spacing:.02em}
.card .cb{padding:0 18px 12px;flex:1}
.card .cf{border-top:1px solid var(--line);padding:11px 18px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);background:var(--raised)}
.card .cf a{font:700 13.5px var(--font-body);color:var(--ink);text-decoration:none}
.card .cf a:hover{color:var(--brass)}
.card.dark{background:var(--turf);color:var(--turf-ink);border-color:transparent}
.card.dark .eyebrow2{color:var(--brass-hi)}
.card.dark .cf{background:rgba(0,0,0,.15);border-color:rgba(255,255,255,.12);color:rgba(255,255,255,.7)}.card.dark .cf a{color:var(--brass-hi)}
.hgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:1100px){.c4,.c5,.c7{grid-column:span 6}.c8{grid-column:span 12}}

function side(g,o){ if(g.oA===o) return {me:g.sA,op:g.sB,myT:g.tA,opT:g.tB,opO:g.oB,res:g.w==='T'?'T':(g.w==='A'?'W':'L')};
  if(g.oB===o) return {me:g.sB,op:g.sA,myT:g.tB,opT:g.tA,opO:g.oA,res:g.w==='T'?'T':(g.w==='B'?'W':'L')}; return null;}
function rec(list){const r={W:0,L:0,T:0};list.forEach(x=>r[x.res]++);return r;}
const recStr=r=>`${r.W}-${r.L}${r.T?'-'+r.T:''}`;

function viewH2H(){
  let a=store.get('h2hA'), b=store.get('h2hB');
  if(!owners.includes(a)) a='Patrick Tighe'; if(!owners.includes(b)||b===a) b=owners.find(o=>o!==a&&o==="Chris L'Heureux")||owners.find(o=>o!==a);
  const opts=sel=>owners.map(o=>`<option${o===sel?' selected':''}>${esc(o)}</option>`).join('');
  app.innerHTML=`<section><h2>Pick two owners</h2>
   <div class="pick"><div><label for="selA">Owner</label><select id="selA">${opts(a)}</select></div><div class="vs">vs</div>
   <div><label for="selB">Opponent</label><select id="selB">${opts(b)}</select></div></div></section>
   <section class="panel" id="h2hOut"></section>
   <section><h2>Every meeting</h2><div class="panel"><ul class="log" id="h2hLog"></ul></div></section>`;
  const draw=()=>{
    const A=selA.value,B=selB.value; store.set('h2hA',A); store.set('h2hB',B);
    const games=G.filter(g=>(g.oA===A&&g.oB===B)||(g.oA===B&&g.oB===A)).map(g=>({g,...side(g,A)}));
    const all=rec(games), reg=rec(games.filter(x=>isReg(x.g))), post=rec(games.filter(x=>!isReg(x.g)));
    const regG=games.filter(x=>isReg(x.g));
    const avg=(k)=>regG.length?(regG.reduce((s,x)=>s+x[k],0)/regG.length).toFixed(1):'–';
    const big=games.filter(x=>isReg(x.g)&&x.res!=='T').sort((x,y)=>Math.abs(y.me-y.op)-Math.abs(x.me-x.op))[0];
    let streak='–';
    if(games.length){const chron=[...games].sort(cmpGame);const last=chron[chron.length-1].res;let n=0;for(let i=chron.length-1;i>=0&&chron[i].res===last;i--)n++;
      streak=last==='T'?`Tied last`:`${last==='W'?esc(A.split(' ')[0]):esc(B.split(' ')[0])} won ${n} straight`;}
    if(A===B){h2hOut.innerHTML=`<p class="note" style="padding:16px">Pick two different owners.</p>`;h2hLog.innerHTML='';return;}
    h2hOut.innerHTML=`<div class="board">
       <div class="nm">${esc(A)}</div><div></div><div class="nm">${esc(B)}</div>
       <div class="big ${all.W>all.L?'lead':''}">${all.W}</div><div class="dash">–</div><div class="big ${all.L>all.W?'lead':''}">${all.L}</div>
       <div class="sub">${games.length?`${games.length} meeting${games.length>1?'s':''}${all.T?`, ${all.T} tie${all.T>1?'s':''}`:''} · ${streak}`:'These two have never played.'}</div></div>
     <div class="facts">
       <div><b>${recStr(reg)}</b><span>Regular season</span></div>
       <div><b>${post.W+post.L+post.T?recStr(post):'–'}</b><span>Playoffs &amp; consolation</span></div>
       <div><b>${avg('me')} – ${avg('op')}</b><span>Avg score, reg. season</span></div>
       <div><b>${big?`${fmt(big.me)}–${fmt(big.op)}`:'–'}</b><span>${big?`Biggest margin · ${big.g.season} Wk ${big.g.week}`:'Biggest margin'}</span></div>
     </div>`;
    h2hLog.innerHTML=games.length?[...games].sort(cmpGame).reverse().map(x=>`<li><div class="when">${whenLabel(x.g)}</div>
      <div class="teams"><div>${esc(x.myT)} <span class="pill ${x.res}">${x.res}</span></div><div class="t">vs ${esc(x.opT)}</div></div>
      <div class="score">${fmt(x.me)}–${fmt(x.op)}</div></li>`).join(''):`<li><div></div><div class="teams">No games yet.</div><div></div></li>`;
  };
  selA.onchange=draw; selB.onchange=draw; draw();
}
function cmpGame(x,y){const a=x.g||x,b=y.g||y;if(a.season!==b.season)return a.season-b.season;const wa=parseInt(a.week),wb=parseInt(b.week);return wa-wb;}

      const r=rec(gs);const o=(DATA.official[y]||{})[t.owner];return{...t,r,pf:o?o[0]:gs.reduce((s,x)=>s+x.me,0),pa:o?o[1]:gs.reduce((s,x)=>s+x.op,0)};};

function ownerStats(o){
  const gs=G.map(g=>({g,...(side(g,o)||{})})).filter(x=>x.res);
  const reg=gs.filter(x=>isReg(x.g)), r=rec(reg);
  const yrs=seasons.filter(y=>!DATA.inprogress[y]&&(DATA.finish[y]||[]).some(t=>t.owner===o));
  const finishes=yrs.map(y=>({y,rank:DATA.finish[y].findIndex(t=>t.owner===o)+1,team:DATA.finish[y].find(t=>t.owner===o).team}));
  const titles=finishes.filter(f=>f.rank===1).map(f=>f.y);
  const finals=finishes.filter(f=>f.rank<=2).length, top4=finishes.filter(f=>f.rank<=4).length;
  const vs={};reg.forEach(x=>{if(!x.opO)return;(vs[x.opO]=vs[x.opO]||{W:0,L:0,T:0})[x.res]++;});
  return{o,gs,reg,r,finishes,titles,finals,top4,vs,ppg:reg.length?reg.reduce((s,x)=>s+x.me,0)/reg.length:0};
}

/* ---------- shared weekly helpers ---------- */
function weekRows(y,regOnly=true){ // all team-scores per season/week
  const m={}; G.filter(g=>g.season===y&&(!regOnly||isReg(g))).forEach(g=>{
    (m[g.week]=m[g.week]||[]).push({o:g.oA,t:g.tA,s:g.sA,op:g.sB,res:g.w==='T'?'T':g.w==='A'?'W':'L',g},{o:g.oB,t:g.tB,s:g.sB,op:g.sA,res:g.w==='T'?'T':g.w==='B'?'W':'L',g});});
  return m;}
const _SL={};function seasonLuck(y){ if(_SL[y]) return _SL[y]; // all-play & luck per owner
  const wk=weekRows(y), out={};_SL[y]=out;
  Object.values(wk).forEach(rows=>{const n=rows.length;
    const top=Math.max(...rows.map(r=>r.s));
    rows.forEach(r=>{const k=r.o||r.t; const x=out[k]=out[k]||{o:r.o,t:r.t,W:0,L:0,T:0,apW:0,apL:0,exp:0,high:0,pf:0,pa:0,g:0,blowL:0};
      x[r.res]++; x.g++; x.pf+=r.s; x.pa+=r.op;
      const beat=rows.filter(z=>z!==r&&z.s<r.s).length, lost=rows.filter(z=>z!==r&&z.s>r.s).length;
      x.apW+=beat; x.apL+=lost; x.exp+=beat/(n-1); if(r.s===top) x.high++;
      if(r.res==='L'&&r.op-r.s>=30) x.blowL++;});});
  Object.values(out).forEach(x=>{x.luck=x.W+x.T/2-x.exp;});
  return out;}
const who=x=>x.o?esc(x.o):`<span class="tbd">${esc(x.t)}</span>`;

/* ---------- Rivalries ---------- */
function rivalry(a,b){
  const gs=G.filter(g=>(g.oA===a&&g.oB===b)||(g.oA===b&&g.oB===a)).map(g=>({g,...side(g,a)})).sort(cmpGame);
  if(!gs.length) return null;
  const r=rec(gs); let best={n:0},run=null;
  const runs={W:{n:0},L:{n:0}};
  gs.forEach(x=>{ if(run&&run.res===x.res) run.n++; else run={res:x.res,n:1}; if(x.res!=='T'&&run.n>runs[x.res].n) runs[x.res]={n:run.n}; });
  const close=[...gs].filter(x=>x.res!=='T').sort((p,q)=>Math.abs(p.me-p.op)-Math.abs(q.me-q.op))[0];
  const big=[...gs].filter(x=>x.res!=='T').sort((p,q)=>Math.abs(q.me-q.op)-Math.abs(p.me-p.op))[0];
  const po=gs.filter(x=>!isReg(x.g)); const por=rec(po);
  const avgM=gs.reduce((s,x)=>s+(x.me-x.op),0)/gs.length;
  return {a,b,gs,r,cur:run,runs,close,big,po,por,avgM};
}

function streaksAll(){ const out=[]; owners.forEach(o=>{const gs=G.filter(isReg).map(g=>({g,...(side(g,o)||{})})).filter(x=>x.res).sort(cmpGame);let best={n:0},cur=null;
  gs.forEach(x=>{if(x.res==='W'){cur=cur?{...cur,n:cur.n+1,to:x.g}:{n:1,from:x.g,to:x.g};if(cur.n>best.n)best=cur;}else cur=null;});if(best.n)out.push({o,...best});}); return out.sort((a,b)=>b.n-a.n);}
function powerRank(y,upto){
  const wk=weekRows(y); const weeks=Object.keys(wk).map(Number).filter(w=>w<=upto).sort((a,b)=>a-b);
  const T={};
  weeks.forEach(w=>{const rows=wk[w]; const n=rows.length;
    rows.forEach(r=>{const x=T[r.o]=T[r.o]||{o:r.o,t:r.t,W:0,L:0,T:0,apW:0,apL:0,pts:[]};
      x[r.res]++; x.pts.push(r.s); x.apW+=rows.filter(z=>z!==r&&z.s<r.s).length; x.apL+=rows.filter(z=>z!==r&&z.s>r.s).length; x.t=r.t;});});
  const L=Object.values(T); const recent=x=>{const p=x.pts.slice(-3);return p.reduce((s,v)=>s+v,0)/p.length;};
  const rmax=Math.max(...L.map(recent)), rmin=Math.min(...L.map(recent));
  L.forEach(x=>{const g=x.W+x.L+x.T; x.wp=(x.W+x.T/2)/g; x.ap=x.apW/(x.apW+x.apL); x.form=(recent(x)-rmin)/((rmax-rmin)||1);
    x.ppg=x.pts.reduce((s,v)=>s+v,0)/x.pts.length; x.power=100*(0.4*x.wp+0.4*x.ap+0.2*x.form);});
  return L.sort((a,b)=>b.power-a.power);
}

/* career aggregates */
function career(o){
  const s=ownerStats(o); const ap={W:0,L:0,crowns:0,luck:0};
  seasons.forEach(y=>{const L=seasonLuck(y);const x=Object.values(L).find(z=>z.o===o);if(x){ap.W+=x.apW;ap.L+=x.apL;ap.crowns+=x.high;ap.luck+=x.luck;}});
  const yrs=s.finishes.map(f=>f.y);
  const po=yrs.filter(y=>playoffOwners(y).has(o)).length;
  const runner=s.finishes.filter(f=>f.rank===2).length;
  const lasts=yrs.filter(y=>(lastOf(y)||{}).owner===o).length;
  const pg=G.filter(g=>g.type==='Playoffs').map(g=>side(g,o)).filter(Boolean); const pr=rec(pg);
  const pf=s.reg.reduce((a,x)=>a+x.me,0), pa=s.reg.reduce((a,x)=>a+x.op,0);
  const blowW=s.reg.filter(x=>x.res==='W'&&x.me-x.op>=30).length, narrowW=s.reg.filter(x=>x.res==='W'&&x.me-x.op<5).length;
  return {...s,ap,po,runner,lasts,pr,pf,pa,blowW,narrowW,nSeasons:seasons.filter(y=>(DATA.finish[y]||[]).some(t=>t.owner===o)).length,nDone:s.finishes.length,wp:s.reg.length?(s.r.W+s.r.T/2)/s.reg.length:0};
}
const CAR={}; owners.forEach(o=>CAR[o]=career(o));
/* legacy score: 35% win %, 25% all-play %, 25% hardware, 15% playoff rate; scaled to league best, shrunk for short careers */
function legacy(){
  const L=owners.map(o=>{const c=CAR[o];const hw=c.titles.length*3+c.runner*1.5+c.po*0.5-c.lasts*0.5;
    return {o,c,wp:c.wp,app:c.ap.W/((c.ap.W+c.ap.L)||1),hw,pr:c.nDone?c.po/c.nDone:0};}).filter(x=>x.c.nSeasons);
  const mx=k=>Math.max(...L.map(x=>x[k])), mn=k=>Math.min(...L.map(x=>x[k]));
  const nrm=(x,k)=>(x[k]-mn(k))/((mx(k)-mn(k))||1);
  L.forEach(x=>{x.score=100*(0.35*nrm(x,'wp')+0.25*nrm(x,'app')+0.25*nrm(x,'hw')+0.15*nrm(x,'pr'))*Math.min(1,Math.sqrt(x.c.nSeasons/6));});
  L.sort((a,b)=>b.score-a.score);
  return L;
}

      <div class="leg">${L.map((x,i)=>`<div class="legrow ${x.o===ME?'me':''} ${isRel(x.o)?'rel':''}" data-mgr="${esc(x.o)}" role="button" tabindex="0"><div class="rk">${String(i+1).padStart(2,'0')}</div>
       <div><div class="tier">${isRel(x.o)?'Relegated · '+relOf(x.o).map(r=>r.y).join(', '):!x.c.nDone?'First season · '+liveY:tierOf(i,x.score)}${x.o===ME?' · You':''}</div><div class="nm">${esc(x.o)}</div></div>
       <div class="c">${x.c.nSeasons}<small>Seasons</small></div>
       <div class="hw"><div>${x.c.titles.length}<small>1st</small></div><div>${x.c.runner}<small>2nd</small></div><div>${x.c.po}<small>Playoffs</small></div><div>${x.c.lasts}<small>Last</small></div></div>
       <div class="c">${(100*x.app).toFixed(0)}%<small>All-play</small></div>
       <div class="sc"><b>${x.score.toFixed(1)}</b><small>Legacy score</small></div></div>`).join('')}</div>
      <details class="panel" style="margin-top:16px;padding:12px 16px"><summary style="cursor:pointer;font-weight:700">Behind the score</summary><p class="note">Legacy score blends regular-season win % (35%), all-play win % (25%), hardware (25%: 3 points per title, 1.5 per runner-up, 0.5 per playoff trip, minus 0.5 per last place) and playoff rate (15%). Each piece is scaled from the league's lowest to highest, then owners with fewer than six seasons are scaled down so a short hot streak doesn't top the list.</p></details>`;}
    else{const LS=Object.fromEntries(L.map(x=>[x.o,x.score]));
      const rows=owners.map(o=>CAR[o]).filter(c=>c.nSeasons).map(c=>{const g=c.reg.length||1;return{c,o:c.o,seasons:c.nSeasons,w:c.r.W,wp:c.wp,ap:(c.ap.W+c.ap.L)?c.ap.W/(c.ap.W+c.ap.L):0,pf:c.pf,pa:c.pa,pfg:c.pf/g,pag:c.pa/g,titles:c.titles.length,finals:c.finals,po:c.po,legacy:LS[c.o]||0};});
      // dir: 1 = higher is better, -1 = lower is better, 0 = no highlight
      const COLS=[['seasons','Seasons',0],['w','W-L-T',0],['wp','Win %',1],['ap','All-play',1],['pf','PF',1],['pa','PA',-1],['titles','Titles',1],['finals','Finals',1],['po','Playoffs',1],['legacy','Legacy',1]];
      let sk=store.get('stSort')||'w', sd=+store.get('stDir')||-1, pg=store.get('stPG')!=='0';
      if(!COLS.some(c=>c[0]===sk)) sk='w';
      const val=(r,k)=>pg&&k==='pf'?r.pfg:pg&&k==='pa'?r.pag:r[k];
      const cell=(r,k)=>{const c=r.c;switch(k){

        const sorted=[...rows].sort((a,b)=>sd*(val(a,sk)-val(b,sk))||b.legacy-a.legacy);
        const elig=rows.filter(r=>r.seasons>=3),hi={};COLS.forEach(([k,,d])=>{if(!d)return;const vs=elig.map(r=>+val(r,k).toFixed(4));const best=d>0?Math.max(...vs):Math.min(...vs),worst=d>0?Math.min(...vs):Math.max(...vs);
          // red only when the worst value isn't shared by a crowd (e.g. a dozen owners with zero titles)

        stT.innerHTML=`<table class="sttbl"><thead><tr><th>#</th><th>Owner</th>${COLS.map(([k,l,d])=>`<th class="n" aria-sort="${k===sk?(sd>0?'ascending':'descending'):'none'}"><button type="button" data-s="${k}" data-d="${d}" title="Sort by ${l}">${l}${k==='pf'||k==='pa'?(pg?'/G':''):''}<span class="ar">${k===sk?(sd>0?'▲':'▼'):''}</span></button></th>`).join('')}</tr></thead><tbody>

        stPG.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.k==='pg')===pg));};
      stOut.innerHTML=`<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:14px"><p class="note" style="margin:0">Tap any column to sort. <span class="sthl hb">Green</span> = best, <span class="sthl hw">red</span> = worst.</p><div class="chips" id="stPG"><button type="button" data-k="tot">Totals</button><button type="button" data-k="pg">Per game</button></div></div>
       <div class="panel tbl" id="stT" style="margin-top:10px"></div>
       <p class="note"><span class="reltag" style="margin:0 4px 0 0">R</span> = relegated. Regular season, ${seasons[0]}–${seasons[seasons.length-1]}${liveY?` (${liveY} through week ${liveW})`:''}. Points are summed from weekly games. Finals = championship game appearances (titles plus runner-ups), completed seasons only. Lowest PA counts as best. Highlights only count owners with 3+ seasons, so a short run can't take green or red. Red is skipped when lots of owners tie for worst (like zero titles). Legacy is explained on the Legacy tab.</p>`;
      stT.onclick=e=>{const b=e.target.closest('button[data-s]');if(!b)return;const k=b.dataset.s;if(k===sk)sd=-sd;else{sk=k;sd=+b.dataset.d===-1?1:-1;}tbl();};
      stPG.onclick=e=>{const b=e.target.closest('button');if(b){pg=b.dataset.k==='pg';tbl();}};
      tbl();}};
  stm.onclick=e=>{const b=e.target.closest('button');if(b){mode=b.dataset.k;draw();}}; draw();
}

       ${DATA.platform[y]==='ESPN'&&!k.startsWith('W')?'<p class="note">ESPN playoff rounds ran two weeks; scores are two-week totals.</p>':''}`;
      muOut.querySelectorAll('[data-h]').forEach(a=>a.onclick=()=>{const [p,q]=a.dataset.h.split('|');store.set('h2hA',p);store.set('h2hB',q);});};
    muW.innerHTML=keys.map(x=>`<button type="button" data-k="${x}">${x.startsWith('W')?x.slice(1):x}</button>`).join('');
    muW.onclick=e=>{const b=e.target.closest('button');if(b){k=b.dataset.k;drawWeek();}}; drawWeek();};

/* ---------- Awards (banners) ---------- */
function seasonExtras(y){
  const pts={};(DRAFT[y]||[]).forEach(p=>{const s=pts[p.o]=pts[p.o]||{o:p.o,p:0,c:0};s.p+=p.p;s.c+=p.$;});
  const bestDraft=Object.values(pts).sort((a,b)=>b.p/b.c-a.p/a.c)[0];
  let poy=null;PL.forEach(p=>p.per.forEach(r=>{if(r[0]===y&&(!poy||r[4]>poy.pts))poy={n:p.n,o:r[1],pts:r[4]};}));
  if(poy){const d=(DRAFT[y]||[]).find(x=>x.n===poy.n);poy.c=d?d.$:null;}
  const L=Object.values(seasonLuck(y));const off=DATA.official[y]||{};L.forEach(x=>{if(off[x.o])x.pf=off[x.o][0];});
  const pk=[...L].sort((a,b)=>b.pf-a.pf)[0], cr=[...L].sort((a,b)=>b.high-a.high)[0], ap=[...L].sort((a,b)=>b.apW-a.apW)[0];
  return {bestDraft,poy,pk,cr,ap};
}

let _REC=null;
function allRecords(){ if(_REC) return _REC;
  const T=(rows,n=10)=>rows.slice(0,n);
  const reg=G.filter(isReg);
  const own=owners.map(o=>CAR[o]).filter(c=>c.nSeasons);
  // by() remembers the exact sort values so ties can be judged on unrounded numbers
  let _lastK=null;
  const R=(name,desc,rows,unit)=>{if(_lastK&&_lastK.length===rows.length)rows.forEach((x,i)=>{x.k=_lastK[i];});_lastK=null;return {name,desc,rows:T(rows),unit};};
  const by=(arr,f,dir=-1)=>{const s=[...arr].sort((a,b)=>dir*(f(a)-f(b)));_lastK=s.map(f);return s;};
  const pr=(c,v,sub)=>({who:mlink(c.o),v,sub});
  // seasons
  const SL=[];seasons.forEach(y=>Object.values(seasonLuck(y)).forEach(x=>{if(x.o){const off=(DATA.official[y]||{})[x.o];SL.push({...x,y,pf:off?off[0]:x.pf,pa:off?off[1]:x.pa,live:!!DATA.inprogress[y]});}}));
  const SLd=SL.filter(x=>!x.live);
  const ss=(x,v,extra='')=>({who:mlink(x.o),v,sub:`${x.y}${extra?' · '+extra:''}`});
  // matchups
  const sc=reg.flatMap(g=>[{s:g.sA,o:g.oA,op:g.sB,vs:g.oB,g,res:g.w==='A'?'W':g.w==='T'?'T':'L'},{s:g.sB,o:g.oB,op:g.sA,vs:g.oA,g,res:g.w==='B'?'W':g.w==='T'?'T':'L'}]).filter(x=>x.o);
  const ms=x=>({who:`${mlink(x.o)}`,v:fmt(x.s),sub:`${x.g.season} wk ${x.g.week} vs ${esc(x.vs)} · ${fmt(x.s)}–${fmt(x.op)}`});
  const gm=reg.map(g=>({g,tot:g.sA+g.sB,m:Math.abs(g.sA-g.sB),wo:g.w==='A'?g.oA:g.oB,lo:g.w==='A'?g.oB:g.oA,ws:Math.max(g.sA,g.sB),ls:Math.min(g.sA,g.sB)}));
  const gs=(x,v)=>({who:`${mlink(x.wo)} <span style="color:var(--muted)">over</span> ${esc(x.lo)}`,v,sub:`${x.g.season} wk ${x.g.week} · ${fmt(x.ws)}–${fmt(x.ls)}`});
  // streaks
  const streak=(pred)=>own.map(c=>{const list=G.filter(isReg).map(g=>({g,...(side(g,c.o)||{})})).filter(x=>x.res).sort(cmpGame);let best={n:0},cur=null;list.forEach(x=>{if(pred(x)){cur=cur?{...cur,n:cur.n+1,to:x.g}:{n:1,from:x.g,to:x.g};if(cur.n>best.n)best=cur;}else cur=null;});return{o:c.o,...best};}).filter(x=>x.n).sort((a,b)=>b.n-a.n);
  const med={};seasons.forEach(y=>Object.entries(weekRows(y)).forEach(([w,rows])=>{const s=rows.map(r=>r.s).sort((a,b)=>a-b);med[y+'|'+w]=(s[s.length/2-1]+s[s.length/2])/2;}));
  const stx=x=>({who:mlink(x.o),v:x.n,sub:`${x.from.season} wk ${x.from.week} → ${x.to.season} wk ${x.to.week}`});
  const seasonStreak=(pred)=>own.map(c=>{let best=0,cur=0,from=null,bf=null,bt=null;c.finishes.forEach(f=>{const x=SLd.find(z=>z.o===c.o&&z.y===f.y);if(x&&pred(x,f)){cur++;if(cur===1)from=f.y;if(cur>best){best=cur;bf=from;bt=f.y;}}else cur=0;});return{o:c.o,n:best,from:bf,to:bt};}).filter(x=>x.n).sort((a,b)=>b.n-a.n);
  // front office
  const per={};TX.forEach(t=>{if(t.ty==='commish')return;t.by.forEach(o=>{const x=per[o]=per[o]||{o,mv:0,tr:0,faab:0};if(t.ty==='trade')x.tr++;else{x.mv++;if(t.f)x.faab+=t.f;}});});
  const partners={};TX.filter(t=>t.ty==='trade').forEach(t=>{const k=[...t.by].sort().join(' & ');partners[k]=(partners[k]||0)+1;});
  const picks=Object.entries(DRAFT).flatMap(([y,P])=>P.map(p=>({...p,y:+y}))).filter(p=>!DATA.inprogress[p.y]);
  const dOwn={};picks.forEach(p=>{const x=dOwn[p.o]=dOwn[p.o]||{o:p.o,p:0,c:0};x.p+=p.p;x.c+=p.$;});
  const dSeas={};picks.forEach(p=>{const k=p.o+'|'+p.y;const x=dSeas[k]=dSeas[k]||{o:p.o,y:p.y,p:0,c:0};x.p+=p.p;x.c+=p.$;});
  // players
  const prow=PL.flatMap(p=>p.per.map(r=>({n:p.n,pos:p.pos,y:r[0],o:r[1],wr:r[2],ws:r[3],pts:r[4],bw:r[5],bwk:r[6]})));
  const fr={};prow.filter(r=>!DATA.inprogress[r.y]).forEach(r=>{const k=r.o+'|'+r.n;const x=fr[k]=fr[k]||{o:r.o,n:r.n,p:0,ys:new Set()};x.p+=r.pts;x.ys.add(r.y);});
  const seenG=new Set();
  _REC=[
   {key:'career',name:'Careers',icon:'crown',desc:'Winning, scoring and hardware over a whole career.',groups:[
     ['Winning',[R('Career wins','Most regular-season wins.',by(own,c=>c.r.W).map(c=>pr(c,c.r.W,recStr(c.r)))),
      R('Career losses','Most regular-season losses.',by(own,c=>c.r.L).map(c=>pr(c,c.r.L,recStr(c.r)))),
      R('Best win percentage','Regular season, three-season minimum.',by(own.filter(c=>c.nSeasons>=3),c=>c.wp).map(c=>pr(c,(100*c.wp).toFixed(1)+'%',recStr(c.r)))),
      R('Career all-play wins','Every weekly score compared with every other team that week.',by(own,c=>c.ap.W).map(c=>pr(c,c.ap.W,`${c.ap.W}-${c.ap.L}`))),
      R('Best all-play record','All-play win %, three-season minimum.',by(own.filter(c=>c.nSeasons>=3),c=>c.ap.W/(c.ap.W+c.ap.L)).map(c=>pr(c,(100*c.ap.W/(c.ap.W+c.ap.L)).toFixed(1)+'%',`${c.ap.W}-${c.ap.L}`))),
      R('Blowout wins','Wins by 30 or more.',by(own,c=>c.blowW).map(c=>pr(c,c.blowW))),
      R('Narrow wins','Wins by less than 5.',by(own,c=>c.narrowW).map(c=>pr(c,c.narrowW)))]],
     ['Scoring',[R('Career points','Regular-season points scored.',by(own,c=>c.pf).map(c=>pr(c,Math.round(c.pf).toLocaleString('en-US'),`${(c.pf/(c.reg.length||1)).toFixed(1)} per game`))),
      R('Weekly crowns','Weeks as the league\'s top scorer.',by(own,c=>c.ap.crowns).map(c=>pr(c,c.ap.crowns)))]],
     ['Hardware',[R('Championships','League titles.',by(own,c=>c.titles.length).filter(c=>c.titles.length).map(c=>pr(c,c.titles.length,c.titles.join(', ')))),
      R('Finals appearances','Title-game trips.',by(own,c=>c.finals).filter(c=>c.finals).map(c=>pr(c,c.finals))),
      R('Playoff appearances','Seasons in the playoff bracket.',by(own,c=>c.po).map(c=>pr(c,c.po,`of ${c.nDone} seasons`))),
      R('Playoff wins','Wins in playoff games.',by(own,c=>c.pr.W).map(c=>pr(c,c.pr.W,recStr(c.pr)))),
      R('Last-place finishes','The other kind of hardware.',by(own,c=>c.lasts).filter(c=>c.lasts).map(c=>pr(c,c.lasts)))]],
     ['Fortune',[R('Luckiest career','Actual wins minus all-play expected wins.',by(own,c=>c.ap.luck).map(c=>pr(c,(c.ap.luck>=0?'+':'')+c.ap.luck.toFixed(1)))),
      R('Unluckiest career','Fewest wins against what all-play expected.',by(own,c=>c.ap.luck,1).map(c=>pr(c,c.ap.luck.toFixed(1))))]]]},
   {key:'seasons',name:'Seasons',icon:'calendar-range',desc:'The dominant runs and the ones everyone remembers for the wrong reasons.',groups:[

      R('Best point differential','',by(SLd,x=>x.pf-x.pa).map(x=>ss(x,'+'+fmt(+(x.pf-x.pa).toFixed(1))))),

const sameVal=(x,y)=>(typeof x.k==='number'&&typeof y.k==='number')?Math.abs(x.k-y.k)<1e-9:String(x.v)===String(y.v);
const holders=r=>r.rows.filter(x=>sameVal(x,r.rows[0]));
const tieRanks=rows=>rows.map(x=>{const f=rows.findIndex(y=>sameVal(y,x));const n=rows.filter(y=>sameVal(y,x)).length;return (n>1?'T-':'')+(f+1);});
const holderHTML=(r,stack)=>{const H=holders(r);if(H.length===1){const t=H[0];return `${t.who}${t.sub?`<small>${t.sub}</small>`:''}`;}
  return `<span class="tiechip">Tied · ${H.length}</span>`+H.map(t=>stack?`<div class="tieh">${t.who}${t.sub?`<small>${t.sub}</small>`:''}</div>`:t.who).join(stack?'':' &amp; ');};

/* ---------- Timeline ---------- */
function viewTimeline(){
  const own=y=>new Set((DATA.finish[y]||[]).map(t=>t.owner).filter(Boolean));
  const items=[...seasons].reverse().map(y=>{const prev=seasons[seasons.indexOf(y)-1];const ev=[];
    const live=DATA.inprogress[y];
    if(!live){const c=DATA.finish[y][0];ev.push(['trophy',`<b>${mlink(c.owner)}</b> took the title`,esc(c.team),'gold']);}
    else ev.push(['loader',`Season in progress`,`Through week ${live}`]);
    const cm=COMMISH[y], pcm=COMMISH[y-1];
    if(cm) ev.push(['gavel',cm!==pcm?`<b>${mlink(cm)}</b> takes over as commissioner`:`Commissioner: ${mlink(cm)}`,cm!==pcm&&pcm?`Took the keys from ${esc(pcm)}`:'','gold']);
    if(prev){const a=own(prev),b=own(y);[...b].filter(o=>!a.has(o)&&!seasons.slice(0,seasons.indexOf(y)).some(s=>own(s).has(o))).forEach(o=>ev.push(['user-plus','Promoted in',mlink(o)]));
      [...b].filter(o=>!a.has(o)&&seasons.slice(0,seasons.indexOf(y)).some(s=>own(s).has(o))).forEach(o=>ev.push(['rotate-ccw','Returned',mlink(o)]));
      [...a].filter(o=>!b.has(o)).forEach(o=>ev.push(['arrow-down',`<b>Relegated</b> after ${prev}`,`${mlink(o)} · finished ${ord(DATA.finish[prev].findIndex(t=>t.owner===o)+1)}`]));
      if(DATA.platform[prev]!==DATA.platform[y]) ev.push(['arrow-right-left',`Moved from ${DATA.platform[prev]} to ${DATA.platform[y]}`,'']);}
    else ev.push(['flag','Stats era begins','First season with full scores and standings (ESPN, 10 teams)']);
    const kp=(DRAFT[y]||[]).filter(p=>p.k).length; if(kp) ev.push(['lock',`Keepers arrive`,`${kp} kept players in the auction`]);
    const L=Object.values(seasonLuck(y)); const top=L.sort((a,b)=>b.pf-a.pf)[0]; if(top&&!live) ev.push(['zap','Points leader',`${mlink(top.o)} · ${fmt(+top.pf.toFixed(1))}`]);
    const ws=G.filter(g=>g.season===y&&isReg(g)).flatMap(g=>[[g.sA,g.oA,g.week],[g.sB,g.oB,g.week]]).sort((a,b)=>b[0]-a[0])[0]; if(ws) ev.push(['flame','Week high',`${mlink(ws[1])} · ${fmt(ws[0])} in week ${ws[2]}`]);
    const tr=TX.filter(t=>t.s===y&&t.ty==='trade').length; if(TX.some(t=>t.s===y)) ev.push(['arrow-left-right',`${tr} trade${tr===1?'':'s'}, ${TX.filter(t=>t.s===y&&t.ty!=='trade'&&t.ty!=='commish').length} waiver moves`,'']);
    return `<div class="tly"><div class="yr"><b>${y}</b><small>${DATA.platform[y]} · ${(DATA.finish[y]||[]).length} teams</small></div><div class="dot"></div><ul>${ev.map(([i,t,s,c])=>`<li><div class="ic ${c||''}">${IC(i)}</div><div>${t}${s?`<small>${s}</small>`:''}</div></li>`).join('')}</ul></div>`;});
  const runs=[];Object.keys(COMMISH).map(Number).sort((p,q)=>p-q).forEach(y=>{const o=COMMISH[y],l=runs[runs.length-1];if(l&&l.o===o&&l.to===y-1)l.to=y;else runs.push({o,from:y,to:y});});
  app.innerHTML=`<div class="card" style="margin-bottom:6px"><div class="ch"><div><div class="eyebrow2">Keepers of the keys</div><h3>Commissioners</h3></div></div>
    <div class="cb"><div class="tiles" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">${runs.slice().reverse().map(r=>`<div class="panel tile" style="box-shadow:none"><div class="k">${r.from}${r.to!==r.from?'–'+(r.to===Math.max(...seasons)?'present':r.to):''}</div><div class="w" style="font-size:17px">${mlink(r.o)}</div><div class="s">${r.to-r.from+1} season${r.to===r.from?'':'s'}</div></div>`).join('')}</div></div></div>
    <div class="tl">${items.join('')}${EARLY.map(e=>`<div class="tly early"><div class="yr"><b>${e.y}<sup>*</sup></b><small>Pre-stats era</small></div><div class="dot"></div><ul>
      <li><div class="ic gold">${IC('trophy')}</div><div><b>${esc(e.champ)}*</b> took the title<small>${esc(e.ct)}</small></div></li>
      <li><div class="ic">${IC('medal')}</div><div>Runner-up: ${esc(e.ru)}*<small>${esc(e.rt)}</small></div></li>
      <li><div class="ic gold">${IC('gavel')}</div><div>Commissioner: ${esc(COMMISH[e.y])}</div></li>
      ${e.note?`<li><div class="ic">${IC('flag')}</div><div>${esc(e.note)}*</div></li>`:''}</ul></div>`).join('')}</div>
    <p class="note" style="margin-top:18px">* ${EARLY[EARLY.length-1].y}–${EARLY[0].y} results come from the league group chat. No scores, records or standings survive from those seasons, so they are shown here only and don't count toward titles, records, head-to-head or any other stats.</p>`;
}

/* ---------- Relegation ---------- */
const RELEG=(()=>{const out=[];seasons.forEach((y,i)=>{const nx=seasons[i+1];if(!nx)return;const A=(DATA.finish[y]||[]).map(t=>t.owner),B=new Set((DATA.finish[nx]||[]).map(t=>t.owner));
  const ins=[...B].filter(o=>!A.includes(o));
  A.forEach((o,k)=>{if(o&&!B.has(o)){const gs=G.filter(g=>g.season===y&&isReg(g)).map(g=>side(g,o)).filter(Boolean);
    out.push({o,y,next:nx,rank:k+1,team:DATA.finish[y][k].team,r:rec(gs),pf:gs.reduce((s,x)=>s+x.me,0),by:ins});}});});return out;})();
const relOf=o=>RELEG.filter(r=>r.o===o);
const lastSeason=seasons[seasons.length-1];
const isRel=o=>relOf(o).length>0&&!(DATA.finish[lastSeason]||[]).some(t=>t.owner===o);
function viewRelegation(){
  const last=RELEG[RELEG.length-1];
  const champs=RELEG.filter(r=>r.rank===1);
  app.innerHTML=`<div class="tiles">
     <div class="panel tile"><div class="k">Relegations</div><div class="v" style="color:var(--rel)">${RELEG.length}</div><div class="s">Owners sent down since 2016</div></div>
     <div class="panel tile"><div class="k">Most recent</div><div class="v" style="color:var(--rel);font-size:30px">${esc(last.o)}</div><div class="s">After the ${last.y} season · replaced by ${last.by.map(esc).join(', ')}</div></div>
     <div class="panel tile"><div class="k">Promoted</div><div class="v" style="color:var(--brass)">${new Set(RELEG.flatMap(r=>r.by)).size}</div><div class="s">New owners who took a relegated seat</div></div>
     ${champs.length?`<div class="panel tile"><div class="k">Champions relegated</div><div class="v" style="color:var(--rel)">${champs.length}</div><div class="s">${champs.map(r=>`${esc(r.o)} (${r.y})`).join(', ')}</div></div>`:''}
   </div>
   <h2 style="margin-top:6px">Every relegation <small>Newest first</small></h2>
   <div style="display:grid;gap:10px">${[...RELEG].reverse().map(r=>`<div class="relcard"><div class="y">${r.y}<small>Last season</small></div>
      <div><div class="tier">Relegated</div><div class="nm"><span data-mgr="${esc(r.o)}" class="lnk" style="text-decoration-color:rgba(255,255,255,.4)">${esc(r.o)}</span></div><div class="s">${esc(r.team)} · finished ${ord(r.rank)} · ${recStr(r.r)} · ${fmt(+r.pf.toFixed(1))} pts</div></div>
      <div class="up">Seat went to<b>${r.by.map(esc).join(', ')||'—'}</b>${r.next} season</div></div>`).join('')}</div>
   <h2 style="margin-top:10px">Career records of relegated owners</h2>
   <div class="panel tbl"><table><thead><tr><th>Owner</th><th class="n">Seasons</th><th class="n">Relegated</th><th class="n">W-L-T</th><th class="n">Win %</th><th class="n">Titles</th></tr></thead><tbody>
   ${[...new Set(RELEG.map(r=>r.o))].map(o=>{const c=CAR[o];return `<tr><td class="who">${mlink(o)}</td><td class="n">${c.nSeasons}</td><td class="n">${relOf(o).map(r=>r.y).join(', ')}</td><td class="n wl">${recStr(c.r)}</td><td class="n">${(100*c.wp).toFixed(1)}</td><td class="n">${c.titles.length||'–'}</td></tr>`;}).join('')}</tbody></table></div>
   <p class="note">An owner who leaves the league after a season is counted as relegated after that season; the newcomer the next year took the seat.</p>`;
}
/* ---------- Draft grades ---------- */
const GRADES=(()=>{const out={};
  Object.entries(DRAFT).forEach(([ys,P])=>{const y=+ys; if(!P.some(p=>p.p>0)) return;
    const byPos={};P.forEach(p=>(byPos[p.pos]=byPos[p.pos]||[]).push(p));
    const exp=new Map();
    Object.values(byPos).forEach(L=>{const n=L.length,mx=L.reduce((s,p)=>s+p.$,0)/n,my=L.reduce((s,p)=>s+p.p,0)/n;
      const sxx=L.reduce((s,p)=>s+(p.$-mx)**2,0),sxy=L.reduce((s,p)=>s+(p.$-mx)*(p.p-my),0);const b=sxx?sxy/sxx:0,a=my-b*mx;
      L.forEach(p=>exp.set(p,Math.max(0,a+b*p.$)));});
    const picks=P.map(p=>({...p,y,exp:exp.get(p),sur:p.p-exp.get(p)}));
    const T={};picks.forEach(p=>{const t=T[p.o]=T[p.o]||{o:p.o,t:p.t,picks:[],sur:0,pts:0,spent:0,pos:{}};t.picks.push(p);t.sur+=p.sur;t.pts+=p.p;t.spent+=p.$;t.pos[p.pos]=(t.pos[p.pos]||0)+p.$;});
    const L=Object.values(T);const m=L.reduce((s,t)=>s+t.sur,0)/L.length;const sd=Math.sqrt(L.reduce((s,t)=>s+(t.sur-m)**2,0)/L.length)||1;
    L.forEach(t=>{t.z=(t.sur-m)/sd;t.grade=t.z>=1.5?'A+':t.z>=1?'A':t.z>=.6?'A-':t.z>=.25?'B+':t.z>=-.1?'B':t.z>=-.4?'B-':t.z>=-.7?'C+':t.z>=-1?'C':t.z>=-1.4?'D':'F';
      t.best=[...t.picks].sort((a,b)=>b.sur-a.sur).slice(0,3);t.worst=[...t.picks].filter(p=>p.$>=5&&p.sur<0).sort((a,b)=>a.sur-b.sur).slice(0,2);});
    L.sort((a,b)=>b.sur-a.sur);L.forEach((t,i)=>t.rank=i+1);
    out[y]={teams:L,picks};});
  return out;})();
const GPTS={'A+':4.3,'A':4,'A-':3.7,'B+':3.3,'B':3,'B-':2.7,'C+':2.3,'C':2,'D':1,'F':0};
const gradeColor=g=>g[0]==='A'?'var(--win)':g[0]==='B'?'var(--num)':g[0]==='C'?'var(--brass)':'var(--loss)';
function viewGrades(){
  const yrs=Object.keys(GRADES).map(Number).sort((a,b)=>b-a);
  let y=+store.get('grY'); if(!yrs.includes(y)) y=yrs.find(z=>!DATA.inprogress[z])||yrs[0];
  app.innerHTML=`<div class="chips" id="grc"><button type="button" data-y="all" aria-pressed="false">All-time</button>${yrs.map(s=>`<button type="button" data-y="${s}">${s}${DATA.inprogress[s]?' (live)':''}</button>`).join('')}</div><div id="grOut" style="display:grid;gap:18px"></div>${Object.keys(DRAFT).filter(z=>!GRADES[z]).map(z=>`<p class="note">${z} draft grades post once the season is complete.</p>`).join('')}`;
  const pickLine=(p,good)=>`<li><div>${esc(p.n)} <span style="color:var(--muted);font-size:12px">${p.pos} · $${p.$}</span></div><b style="color:${good?'var(--win)':'var(--loss)'}">${p.sur>=0?'+':''}${Math.round(p.sur)}</b></li>`;
  const draw=()=>{store.set('grY',y);grc.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.y===String(y))));
    if(y==='all'){const A={};yrs.filter(z=>!DATA.inprogress[z]).forEach(z=>GRADES[z].teams.forEach(t=>{const a=A[t.o]=A[t.o]||{o:t.o,n:0,gp:0,sur:0,list:[]};a.n++;a.gp+=GPTS[t.grade];a.sur+=t.sur;a.list.push({y:z,g:t.grade,sur:t.sur});}));
      const L=Object.values(A).sort((a,b)=>b.gp/b.n-a.gp/a.n);
      const allP=yrs.filter(z=>!DATA.inprogress[z]).flatMap(z=>GRADES[z].picks);
      const steals=[...allP].sort((a,b)=>b.sur-a.sur).slice(0,10),busts=[...allP].sort((a,b)=>a.sur-b.sur).slice(0,10);
      grOut.innerHTML=`<div class="panel tbl"><table><thead><tr><th>#</th><th>Owner</th><th class="n">Drafts</th><th class="n">GPA</th><th class="n">Value added</th><th>Year by year</th></tr></thead><tbody>
        ${L.map((a,i)=>`<tr class="${i<3?'top':''}"><td class="rk">${i+1}</td><td class="who">${mlink(a.o)}</td><td class="n">${a.n}</td><td class="n wl">${(a.gp/a.n).toFixed(2)}</td><td class="n wl ${a.sur>=0?'pos':'neg'}">${a.sur>=0?'+':''}${Math.round(a.sur)}</td>
          <td>${a.list.sort((p,q)=>p.y-q.y).map(x=>`<span style="display:inline-block;margin:1px 3px 1px 0;padding:1px 6px;border-radius:5px;font:700 12px var(--font-stat);border:1px solid var(--line);color:${gradeColor(x.g)}">’${String(x.y).slice(2)} ${x.g}</span>`).join('')}</td></tr>`).join('')}</tbody></table></div>
        <div class="grid2"><div class="panel rec"><h3>Biggest steals <small>Points over expected</small></h3><ol>${steals.map(p=>`<li><div>${esc(p.n)}<small>${esc(p.o)} · ${p.y} · ${p.pos} $${p.$} · ${fmt(p.p)} pts</small></div><div class="v">+${Math.round(p.sur)}</div></li>`).join('')}</ol></div>
        <div class="panel rec"><h3>Biggest busts <small>Points under expected</small></h3><ol>${busts.map(p=>`<li><div>${esc(p.n)}<small>${esc(p.o)} · ${p.y} · ${p.pos} $${p.$} · ${fmt(p.p)} pts</small></div><div class="v" style="color:var(--loss)">${Math.round(p.sur)}</div></li>`).join('')}</ol></div></div>
        <p class="note">GPA averages each completed draft's letter grade (A = 4.0). Value added is total points above what each pick's price usually returns.</p>`;
      return;}
    const G2=GRADES[y];const live=DATA.inprogress[y];
    grOut.innerHTML=`${live?`<p class="note" style="margin:0">${y} grades are based on points through week ${live} and will move as the season goes.</p>`:''}
      <div class="bgrid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${G2.teams.map(t=>`<div class="card" style="padding:16px 18px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><div class="eyebrow2">#${t.rank} · ${esc(t.t||'')}</div><div style="font:800 19px var(--font-body);margin-top:2px">${mlink(t.o)}${isRel(t.o)?'<span class="reltag">R</span>':''}</div>
          <div style="font-size:12.5px;color:var(--muted);margin-top:2px">$${t.spent} spent · ${Math.round(t.pts)} pts drafted · ${t.sur>=0?'+':''}${Math.round(t.sur)} vs expected</div></div>
          <div style="font:900 44px/1 var(--font-display);color:${gradeColor(t.grade)}">${t.grade}</div></div>
        <ul class="gl"><li style="font:700 10.5px var(--font-stat);letter-spacing:.14em;color:var(--muted);text-transform:uppercase">Best values</li>${t.best.map(p=>pickLine(p,true)).join('')}
          ${t.worst.length?`<li style="font:700 10.5px var(--font-stat);letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:6px">Misses</li>${t.worst.map(p=>pickLine(p,false)).join('')}`:''}</ul>
        <div style="display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:12px">${['QB','RB','WR','TE','DEF','K'].filter(k=>t.pos[k]).map((k,i)=>`<i title="${k} $${t.pos[k]}" style="width:${100*t.pos[k]/t.spent}%;background:${['#4f0f1d','#b7892b','#8a5a63','#d9b77a','#6f6866','#c9c2b6'][i]}"></i>`).join('')}</div>
        <div style="font-size:11.5px;color:var(--muted);margin-top:4px">${['QB','RB','WR','TE'].filter(k=>t.pos[k]).map(k=>`${k} ${Math.round(100*t.pos[k]/t.spent)}%`).join(' · ')}</div></div>`).join('')}</div>
      <p class="note">How it works: for each position, the league's ${y} auction sets what a player at a given price usually scored. Every pick is graded on points above or below that line, and teams are curved against each other that year (A+ is 1.5 standard deviations above the league). Points are the player's full-season total.</p>`;};
  grc.onclick=e=>{const b=e.target.closest('button');if(b){y=b.dataset.y==='all'?'all':+b.dataset.y;draw();}};
  if(store.get('grY')==='all') y='all';
  draw();
}

/* ---------- Post-draft grade (current year) ---------- */
function viewDraftGrade(){
  const yrs=Object.keys(DG).map(Number).sort((a,b)=>b-a); let y=+store.get('dgY'); if(!yrs.includes(y)) y=yrs[0];
  const D=DG[y]; let o=store.get('dgO'); if(!D.teams[o]) o=D.teams[ME]?ME:D.order[0];
  const gcol=g=>g[0]==='A'?'var(--win)':g[0]==='B'?'var(--num)':g[0]==='C'?'var(--brass)':'var(--loss)';
  const draw=()=>{store.set('dgY',y);store.set('dgO',o);const T=D.teams[o];const rank=D.order.indexOf(o)+1;
    const graded=T.rows.filter(r=>r[4]!=null);const kept=T.rows.length-graded.length;
    const spent=T.rows.reduce((s,r)=>s+r[0],0), model=graded.reduce((s,r)=>s+r[4],0), edge=graded.reduce((s,r)=>s+r[6],0), proj=graded.reduce((s,r)=>s+r[5],0);
    const [bn,bg]=T.best.split(' | '), [rn,rg]=T.rev.split(' | ');
    app.innerHTML=`${yrs.length>1?`<div class="chips">${yrs.map(z=>`<button type="button" data-y="${z}" aria-pressed="${z===y}">${z}</button>`).join('')}</div>`:''}
    <div class="hgrid">
      <section class="hero c12" style="grid-template-columns:minmax(0,1fr) auto"><div><div class="eyebrow2" style="color:var(--brass-hi)">Post-draft report · ${y} auction · ${ord(rank)} of ${D.order.length}</div>
        <h2>${esc(o)}</h2><p style="margin:0 0 6px">${esc(D.teamName[o]||'')} · $${spent} spent${kept?` · ${kept} keeper${kept>1?'s':''} excluded`:''} · ${graded.length} picks graded</p>
        <p style="font-size:18px;font-weight:700;margin:0">${esc(T.hl)}</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><span class="badge">Best ticket: ${esc(bn)} · ${esc(bg)}</span>${rg?`<span class="badge" style="color:#f3c1b8;border-color:rgba(243,193,184,.5)">Review: ${esc(rn)} · ${esc(rg)}</span>`:`<span class="badge">No red flag</span>`}</div></div>
        <div class="crestbox" style="display:block;min-width:150px"><div class="eyebrow2">Draft grade</div><b style="font-size:64px;line-height:1;color:#fff">${T.g}</b><div style="font:700 15px var(--font-display);color:var(--brass-hi)">${T.sc}/100</div></div></section>
      <div class="c4">${card('The room','League Draft Board',`<div>${D.order.map((m,i)=>{const t=D.teams[m];return `<div class="rrow ${m===o?'me':''}" data-o="${esc(m)}" role="button" tabindex="0" style="cursor:pointer"><div class="n">${String(i+1).padStart(2,'0')}</div><div class="ini ${isRel(m)?'rel':''}">${inits(m)}</div><div class="nm">${esc(m)}${m===ME?' <span style="font:700 10px var(--font-stat);color:var(--brass)">YOU</span>':''}<small>${t.rows.filter(r=>r[4]!=null).length} picks graded</small></div><div class="big" style="color:${gcol(t.g)}">${t.g}<small>${t.sc}</small></div></div>`;}).join('')}</div>`,`<span>Tap a manager to open their audit</span>`)}</div>
      <div class="c8">${card('The receipts',`${esc(o.split(' ')[0])}'s pick-by-pick audit`,`<div class="kv" style="grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:12px"><div><span>Paid (graded)</span><b>$${graded.reduce((s,r)=>s+r[0],0)}</b></div><div><span>Model value</span><b>$${model}</b></div><div><span>Value edge</span><b style="color:${edge>=0?'var(--win)':'var(--loss)'}">${edge>=0?'+':''}${edge}</b></div><div><span>Projected pts</span><b>${proj.toLocaleString('en-US')}</b></div></div>
        <div class="tbl"><table><thead><tr><th class="n">Price</th><th>Player</th><th class="n">Model</th><th class="n">Edge</th><th>Read</th><th class="n">Grade</th></tr></thead><tbody>
        ${T.rows.map(r=>{const kp=/Keeper/.test(r[3]);return `<tr${kp?' style="opacity:.6"':''}><td class="n"><b>$${r[0]}</b><small style="display:block;color:var(--muted);font-size:11.5px">Nom. ${r[1]}</small></td><td class="who">${esc(r[2])}<small>${esc(r[3].replace(' Keeper',''))}${kp?' · keeper':''}</small></td>
          <td class="n">${r[4]!=null?`$${r[4]}<small style="display:block;color:var(--muted);font-size:11.5px">${r[5]} pts</small>`:'—'}</td><td class="n wl ${r[6]>0?'pos':r[6]<0?'neg':''}">${r[6]==null?'—':r[6]===0?'At cost':(r[6]>0?'+$':'−$')+Math.abs(r[6])}</td>
          <td style="font-size:12.5px;color:var(--muted);max-width:240px">${esc(r[7])}</td><td class="n" style="font:800 18px var(--font-display);color:${r[8]==='—'?'var(--muted)':gcol(r[8])}">${r[8]}</td></tr>`;}).join('')}</tbody></table></div>`,`<span>Model = league dollar value from projections · Edge = model − paid</span>`)}</div>
      <div class="c12">${card('The method','Two boards, one verdict',`<div class="grid2" style="gap:18px;font-size:13.5px">
        <div><div class="eyebrow2">Signal one · league projection board</div><p>Every player's season projection is rescored with CFFFL scoring (4-pt passing TDs, full PPR, 0.1 per rushing and receiving yard) and valued against replacement level for this league's lineup: QB, 2 RB, 3 WR, TE, FLEX, SUPERFLEX and DEF, 10 teams, $200 budgets. 90% of the auction pool goes to starters on a top-heavy curve, calibrated to what positions have sold for in past CFFFL auctions.</p></div>
        <div><div class="eyebrow2">Signal two · price paid</div><p>Each winning bid is compared with that league dollar value. The difference is the value edge, and each pick gets a letter grade on a fixed scale. Nomination order doesn't matter, and keepers are shown but not graded.</p></div>
        <div><div class="eyebrow2">Final score · capital-weighted, league-curved</div><p>Expensive buys count more than $1 fliers, so a bad first-round price can't hide behind late bargains. Team scores are curved around 80 so the room spreads out from best to worst draft.</p></div>
        <div><div class="eyebrow2">What it isn't</div><p>A draft-day process grade, not a prediction of where a team finishes. For hindsight grades based on actual points, see Draft Grades after the season.</p></div></div>`,`<span>${y} grades captured from the league's post-draft report</span>${goLink('grades','Hindsight grades')}`)}</div>
    </div>`;
    app.querySelectorAll('[data-o]').forEach(el=>{el.onclick=()=>{o=el.dataset.o;draw();addHead('dg');window.scrollTo(0,0);};el.onkeydown=e=>{if(e.key==='Enter')el.click();};});
    app.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{y=+b.dataset.y;draw();addHead('dg');});};
  draw();
}

const views={home:viewHome,dg:viewDraftGrade,grades:viewGrades,relegation:viewRelegation,standings:viewStandings,moves:viewMoves,matchups:viewMatchups,power:viewPower,seasons:viewSeasons,awards:viewAwards,honors:viewHonors,records:viewRecordBook,timeline:viewTimeline,managers:viewManagers,owners:viewManagers,h2h:viewH2H,rivalries:viewRivalries,drafts:viewDrafts,players:viewPlayers};
